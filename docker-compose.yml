name: atrepresentaciones

x-db-env: &db-env
  POSTGRES_DB: ${DB_NAME:-atrepresentaciones}
  POSTGRES_USER: ${DB_USER:-atrep}
  POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}

services:
  # ---------------------------------------------------------------- base de datos
  # Sin puertos publicados: sólo accesible desde la red interna "backend".
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      <<: *db-env
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  # ------------------------------------------------------------------------ API
  api:
    build: ./backend
    image: atrepresentaciones/api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-atrepresentaciones}
      DB_USER: ${DB_USER:-atrep}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
    networks: [backend, frontend]

  # ------------------------------------------------------------- web (nginx + SPA)
  web:
    build: ./frontend
    image: atrepresentaciones/web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    networks: [frontend]

  # ------------------------------------------------- respaldo diario de la base
  backup:
    image: postgres:16.6-alpine
    restart: unless-stopped
    depends_on:
      api: # la API aplica las migraciones al arrancar
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-atrepresentaciones}
      PGUSER: ${DB_USER:-atrep}
      PGPASSWORD: ${DB_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: America/Asuncion
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/$${PGDATABASE}_$$(date +%Y%m%d_%H%M%S).dump
          if pg_dump -Fc -f "$$f"; then echo "Respaldo creado: $$f"; else echo "ERROR al respaldar"; rm -f "$$f"; fi
          find /backups -name '*.dump' -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    internal: true
  frontend:
